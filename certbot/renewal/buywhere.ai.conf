# Certbot renewal configuration for buywhere.ai / www.buywhere.ai
# This file should be deployed to /etc/letsencrypt/renewal/buywhere.ai.conf
# Deploy with: sudo cp certbot/renewal/buywhere.ai.conf /etc/letsencrypt/renewal/

domain = buywhere.ai
domains = buywhere.ai www.buywhere.ai
cert = /etc/letsencrypt/live/buywhere.ai/fullchain.pem
privkey = /etc/letsencrypt/live/buywhere.ai/privkey.pem
chain = /etc/letsencrypt/live/buywhere.ai/chain.pem
fullchain = /etc/letsencrypt/live/buywhere.ai/fullchain.pem

account = system
arch = x86_64
authenticator = webroot
webroot-path = /var/www/certbot
allow_subset = no
expand = yes
reuse-key = yes
key-type = rsa
random_serial = yes

post-hook = systemctl reload nginx
renew-hook = systemctl reload nginx
