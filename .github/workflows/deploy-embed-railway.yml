# deploy-embed-railway — BUY-41158
# Deploys the embed-worker service (api-embed/) to Railway.
# The embed pipeline runs embedRunner.ts which self-schedules every 6h,
# embedding products whose title+description have changed since the last run.
#
# Architecture (BUY-52466):
#   - gemini-embedding-001 (512-dim, outputDimensionality=512, taskType=RETRIEVAL_DOCUMENT)
#   - Reads candidates from REPLICA_DATABASE_URL, writes to VECTOR_DB_URL
#   - Hash-gated: skips products where md5(title||description) matches existing product_embeddings row
#
# Railway env vars needed on the embed-worker service (must be set in Railway dashboard):
#   GEMINI_API_KEY          — Google API key for gemini-embedding-001
#   VECTOR_DB_URL           — PostgreSQL connection (pgvector) for product_embeddings table
#   REPLICA_DATABASE_URL    — Read replica connection for pulling product candidates
#   DATABASE_URL            — Primary DB (used by embedRunner for its internal pool)
#
# To find the Railway SERVICE_ID for api-embed:
#   railway service list
#   # or via GraphQL:
#   curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
#     -H "Content-Type: application/json" \
#     -d '{"query":"{ me { projects { instances { id name } } } }"}' \
#     https://backboard.railway.com/graphql/v2
#   # Look for the service named "api-embed" or equivalent in the Railway project.

name: Deploy embed-worker to Railway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['api-embed/**', 'api/src/jobs/embedRunner.ts', 'api/src/jobs/embedProducts.ts']

permissions:
  contents: read

concurrency:
  group: buywhere-embed-railway
  cancel-in-progress: false

env:
  # Railway service ID for buywhere-embed-worker (found via GraphQL: railway service list)
  RAILWAY_SERVICE_ID: 34c5cb68-bb90-4e09-9c6b-4eb789022db3
  RAILWAY_ENVIRONMENT_ID: ebcb2ca2-f5e8-4713-a3e1-48c92e2b23ae
  GQL: https://backboard.railway.com/graphql/v2

jobs:
  deploy:
    name: Deploy embed-worker to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Typecheck embed pipeline
        working-directory: api
        run: |
          npm ci --silent 2>&1 | tail -3
          # Project-wide typecheck; gate on embed pipeline files being clean.
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/ts.txt || true
          EMBED_ERRORS=$(grep -E 'embedRunner\.ts|embedProducts\.ts' /tmp/ts.txt | grep -c 'error TS' || echo 0)
          echo "Embed-pipeline TS errors: $EMBED_ERRORS"
          if [ "$EMBED_ERRORS" -gt 0 ]; then echo "::error::Embed pipeline TS errors"; grep -E 'embedRunner|embedProducts' /tmp/ts.txt; exit 1; fi

      - name: Trigger Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying api-embed to Railway service $RAILWAY_SERVICE_ID (buywhere-embed-worker)"
          RESP=$(curl -sf "$GQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0" \
            -d "{\"query\":\"mutation { serviceInstanceDeployV2(serviceId: \\\"$RAILWAY_SERVICE_ID\\\", environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\", commitSha: \\\"$GITHUB_SHA\\\") }\"}")
          DID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['serviceInstanceDeployV2'])")
          echo "deployment: $DID"

          for i in $(seq 1 25); do
            S=$(curl -sf "$GQL" -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0" \
              -d "{\"query\":\"query { deployment(id: \\\"$DID\\\") { status } }\"}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['deployment']['status'])")
            echo "[$i] $S"
            case "$S" in
              SUCCESS)  echo "Deploy succeeded"; exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "::error::Deploy failed: $S"; exit 1 ;;
            esac
            sleep 25
          done
          echo "::error::Deploy timed out after 25 polls"
          exit 1

      - name: Verify embed queue / product_embeddings
        run: |
          # Poll Railway deployment logs for embed-runner startup signals.
          # The embedRunner self-schedules on boot so we just verify the service is alive.
          echo "=== Checking Railway deployment status ==="
          echo "Note: Direct Railway log access requires 'railway logs' CLI or Railway dashboard."
          echo ""
          echo "To verify the embed pipeline is running:"
          echo "  1. Railway dashboard: https://railway.app/project/$RAILWAY_ENVIRONMENT_ID"
          echo "  2. Check the api-embed service is HEALTHY (green)"
          echo "  3. In Railway logs, look for: '[embed-runner] Starting — interval=360m'"
          echo "  4. After ~6h, check product_embeddings row count:"
          echo "     SELECT COUNT(*) FROM product_embeddings;"
          echo ""
          echo "Required Railway env vars (set in Railway dashboard for api-embed service):"
          echo "  GEMINI_API_KEY        — Google API key for gemini-embedding-001"
          echo "  VECTOR_DB_URL         — pgvector connection string"
          echo "  REPLICA_DATABASE_URL  — replica connection string"
          echo "  DATABASE_URL          — primary DB connection string"
