name: Deploy buywhere-site Next.js to Production

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build step (use pre-built .next)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: buywhere-site-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_ROOT: /srv/buywhere-site
  SERVER_PATH: ${{ secrets.PRODUCTION_DEPLOY_USER }}@${{ secrets.PRODUCTION_DEPLOY_HOST }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.buywhere.ai' }}

jobs:
  build:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_build != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}

      - name: Upload .next artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-nextjs-build
          path: frontend/.next/
          retention-days: 1

  deploy:
    name: Deploy to Production (buywhere.ai)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.skip_build != 'true' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download .next artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-nextjs-build
          path: frontend/.next/

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}

      - name: Trust production host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.PRODUCTION_DEPLOY_PORT || 22 }}" -H "${{ secrets.PRODUCTION_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Next.js build to server
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -p $DEPLOY_PORT" \
            --exclude '.git' \
            --exclude 'node_modules' \
            frontend/.next/ \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/frontend/.next/

      - name: Verify deployment
        run: |
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "https://buywhere.ai/" --max-time 10 --retry 2 2>/dev/null || echo "000")
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "Health check passed (HTTP $HTTP_CODE)"
          else
            echo "WARNING: Health check returned HTTP $HTTP_CODE"
          fi

  deploy-skip-build:
    name: Deploy Pre-built to Production (skip build)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_build == 'true' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}

      - name: Trust production host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.PRODUCTION_DEPLOY_PORT || 22 }}" -H "${{ secrets.PRODUCTION_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy pre-built .next to server
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -p $DEPLOY_PORT" \
            --exclude '.git' \
            --exclude 'node_modules' \
            frontend/.next/ \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/frontend/.next/

      - name: Verify deployment
        run: |
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "https://buywhere.ai/" --max-time 10 --retry 2 2>/dev/null || echo "000")
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "Health check passed (HTTP $HTTP_CODE)"
          else
            echo "WARNING: Health check returned HTTP $HTTP_CODE"
          fi