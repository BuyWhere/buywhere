# BUY-73697: cold + warm latency probe for partition-pruned mcp-railway search_products.
# Ad-hoc probe — dispatches via workflow_dispatch. Targets https://mcp.buywhere.ai/mcp.
# Writes structured output to data/buy-73697/latency.json (committed back if changed).
name: BUY-73697 partition-prune latency probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_URL: https://mcp.buywhere.ai
  OUTPUT_PATH: data/buy-73697/latency.json

jobs:
  probe:
    name: Cold + warm latency probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cold + warm latency probe (search_products)
        env:
          BUYWHERE_MCP_API_KEY: ${{ secrets.BUYWHERE_MCP_API_KEY }}
          MCP_URL: ${{ env.MCP_URL }}
          OUTPUT_PATH: ${{ env.OUTPUT_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"

          QUERY='laptop'  # BUY-73697 — use warm-seed query so 2nd hit hits Redis
          COUNTRIES=(SG US PH ID TH)

          jq -n --arg q "$QUERY" --arg ts "$(date -u +%FT%TZ)" '{
            ticket: "BUY-73697",
            target: "mcp.buywhere.ai/mcp",
            query: $q,
            measured_at: $ts,
            cold_ms: {},
            warm_ms: {},
            per_country: {}
          }' > "$OUTPUT_PATH"

          echo "=== Cold probes (one-shot, no warm-up) ==="
          for CC in "${COUNTRIES[@]}"; do
            RESP=$(curl -sS --max-time 30 -X POST "${MCP_URL}/mcp" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${BUYWHERE_MCP_API_KEY}" \
              -w "\n__TIME__:%{time_total}\n__HTTP__:%{http_code}\n" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":\"buy-73697-cold-$CC\",\"method\":\"tools/call\",\"params\":{\"name\":\"search_products\",\"arguments\":{\"q\":\"$QUERY\",\"country_code\":\"$CC\",\"limit\":20}}}")
            HTTP=$(echo "$RESP" | grep '^__HTTP__:' | cut -d: -f2)
            TIME=$(echo "$RESP" | grep '^__TIME__:' | cut -d: -f2)
            MS=$(awk -v t="$TIME" 'BEGIN{printf "%.0f", t*1000}')
            BODY=$(echo "$RESP" | grep -v '^__')
            # Extract country_code and merchant sources
            COUNTRIES_SET=$(echo "$BODY" | python3 -c "import json,sys
          d=json.loads(sys.stdin.read())
          prods=d.get('result',{}).get('content',[{}])[0].get('text')
          prods=json.loads(prods) if isinstance(prods,str) else prods
          items=prods.get('products') if isinstance(prods,dict) else None
          items=items if items is not None else (prods or [])
          from collections import Counter
          print(Counter(p.get('offers',{}).get('priceCurrency') or p.get('country_code','?') for p in items).most_common())
          print('country_codes:', Counter(p.get('country_code','?') for p in items).most_common())
          print('count:', len(items))" 2>/dev/null || echo "parse-error")
            echo "  $CC http=$HTTP ms=$MS"
            echo "  $CC $COUNTRIES_SET" | tr '\n' ' '
            echo
            jq --arg cc "$CC" --argjson ms "$MS" --arg http "$HTTP" \
              '.cold_ms[$cc]=$ms|.per_country[$cc]={cold_ms:$ms,http:$http}|.per_country[$cc].summary=$ARGS.positional[0]' \
              --arg summary "$COUNTRIES_SET" \
              "$OUTPUT_PATH" > "$OUTPUT_PATH.tmp" && mv "$OUTPUT_PATH.tmp" "$OUTPUT_PATH"
          done

          echo
          echo "=== Warm probes (3 sequential hits per country) ==="
          for CC in "${COUNTRIES[@]}"; do
            for i in 1 2 3; do
              RESP=$(curl -sS --max-time 30 -X POST "${MCP_URL}/mcp" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${BUYWHERE_MCP_API_KEY}" \
                -w "\n__TIME__:%{time_total}\n__HTTP__:%{http_code}\n" \
                -d "{\"jsonrpc\":\"2.0\",\"id\":\"buy-73697-warm-$CC-$i\",\"method\":\"tools/call\",\"params\":{\"name\":\"search_products\",\"arguments\":{\"q\":\"$QUERY\",\"country_code\":\"$CC\",\"limit\":20}}}")
              TIME=$(echo "$RESP" | grep '^__TIME__:' | cut -d: -f2)
              MS=$(awk -v t="$TIME" 'BEGIN{printf "%.0f", t*1000}')
              echo "  $CC warm#$i ms=$MS"
              jq --arg cc "$CC" --argjson i "$i" --argjson ms "$MS" \
                '.warm_ms[$cc][("run-"+$i|tostring)]=$ms' \
                "$OUTPUT_PATH" > "$OUTPUT_PATH.tmp" && mv "$OUTPUT_PATH.tmp" "$OUTPUT_PATH"
            done
          done

          cat "$OUTPUT_PATH"