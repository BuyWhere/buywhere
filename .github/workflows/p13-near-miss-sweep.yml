name: P1.3-NM nightly near-miss sweep

on:
  schedule:
    # 23:55 UTC nightly, per P1.3-NM spec
    - cron: '55 23 * * *'
  workflow_dispatch:

env:
  BUYWHERE_MCP_URL: https://api.buywhere.ai/mcp
  CATALOG_DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
  BUYWHERE_API_KEY: ${{ secrets.BUYWHERE_MCP_API_KEY }}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run P1.3-NM 315-cell sweep
        run: node scripts/eval/p13-near-miss-sweep.mjs
        env:
          SWEEP_CONCURRENCY: 1
          SWEEP_MIN_DELAY_MS: 350

      - name: Upload sweep JSONL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13-near-miss-sweep-${{ github.run_id }}
          path: data/sweep/zrr/*.jsonl
          retention-days: 30
