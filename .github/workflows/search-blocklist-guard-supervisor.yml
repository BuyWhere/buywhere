# search-blocklist-guard-supervisor — BUY-72491 (v1 of pair).
# Companion to search-blocklist-guard.yml that hard-fails when the guard
# workflow OR its dedicated regression test file is missing from HEAD. Closes
# the bypass where a single reset-and-reapply commit can delete either.
#
# Why two files? The supervisor and the guarded file live at DIFFERENT paths.
# To bypass both, a reset-and-reapply must delete BOTH — which requires a
# much larger file-touch footprint, easier to spot in PR review.
#
# Required at HEAD:
#   - .github/workflows/search-blocklist-guard.yml  (the guard workflow)
#   - src/app/search/SearchResultsClient.blocklist.test.mjs  (its regression test)
#
# Triggers: pull_request to main + push to main + workflow_dispatch (test mode).
# Behavior: hard-fails (exit 1) with ::error:: naming the missing file(s).
# Override: none — author must restore the missing file in the same PR.

name: search-blocklist-guard-supervisor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_missing:
        description: 'Set to "true" to simulate one of the required files as missing (test mode)'
        required: false
        default: 'false'
      missing_file:
        description: 'Path of the file to simulate as missing'
        required: false
        default: '.github/workflows/search-blocklist-guard.yml'

concurrency:
  group: search-blocklist-guard-supervisor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine which paths are required in HEAD
        run: |
          set -euo pipefail

          # The set of files that MUST exist at HEAD for the search-blocklist
          # guard net to be intact. Adding a new file? Add its path here AND
          # ship the new file in the same commit so the supervisor's own
          # introduction does not trip the guard.
          cat > required-guards.txt <<'EOF'
          .github/workflows/search-blocklist-guard.yml
          src/app/search/SearchResultsClient.blocklist.test.mjs
          EOF

          REQUIRED_COUNT=$(wc -l < required-guards.txt)
          echo "Required files: $REQUIRED_COUNT"
          cat required-guards.txt

      - name: Compute diff base for PR head or push to main
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin main:main >/dev/null 2>&1 || true
            BASE="origin/main"
          else
            BASE="HEAD~1"
          fi
          echo "$BASE" > diff-base.txt
          echo "${{ github.sha }}" > head-sha.txt
          echo "Diff base: $BASE"
          echo "HEAD sha: ${{ github.sha }}"

      - name: Check each required file exists in HEAD
        id: presence
        run: |
          set -euo pipefail

          # Track which required files are PRESENT vs MISSING.
          : > present.txt
          : > missing.txt

          while IFS= read -r required; do
            [ -z "$required" ] && continue
            if [ -f "$required" ]; then
              echo "$required" >> present.txt
            else
              echo "$required" >> missing.txt
              echo "::error::Required guard file missing at HEAD: $required"
            fi
          done < required-guards.txt

          PRESENT=$(wc -l < present.txt || echo 0)
          MISSING=$(wc -l < missing.txt || echo 0)
          echo "Present: $PRESENT  Missing: $MISSING"
          echo "missing_count=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Test mode — simulate a missing file (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.simulate_missing == 'true'
        run: |
          set -euo pipefail
          SIM="${{ inputs.missing_file }}"
          echo "TEST MODE: simulating absence of $SIM"
          # Force the simulated file into missing.txt regardless of its real
          # presence. Add it unconditionally so test mode works even when the
          # file was actually present in step 5.
          echo "$SIM" >> missing.txt
          # Also drop it from present.txt if it was there.
          sed -i.bak "/^${SIM//\//\\/}$/d" present.txt || true
          PRESENT=$(wc -l < present.txt || echo 0)
          MISSING=$(wc -l < missing.txt || echo 0)
          echo "After simulation — Present: $PRESENT  Missing: $MISSING"

      - name: Build presence audit (JSON) for evidence artifact
        if: always()
        run: |
          set -euo pipefail
          python3 > presence-audit.json <<'PYEOF'
          import json, os, pathlib
          head_sha = os.environ.get("GITHUB_SHA", "").strip()
          present = [l.strip() for l in pathlib.Path("present.txt").read_text().splitlines() if l.strip()]
          missing_paths = [l.strip() for l in pathlib.Path("missing.txt").read_text().splitlines() if l.strip()]
          required = [l.strip() for l in pathlib.Path("required-guards.txt").read_text().splitlines() if l.strip()]
          audit = {
              "guard": "search-blocklist-guard-supervisor",
              "issue": "BUY-72491",
              "head_sha": head_sha,
              "required_files": required,
              "present_files": present,
              "missing_files": missing_paths,
              "guard_intact": len(missing_paths) == 0,
          }
          print(json.dumps(audit, indent=2))
          PYEOF
          cat presence-audit.json

      - name: 'Emit ::error:: and hard-fail when a guard file is missing'
        run: |
          set -euo pipefail
          MISSING=$(wc -l < missing.txt || echo 0)

          if [ "$MISSING" -eq 0 ]; then
            echo "Guard intact — all required search-blocklist-guard files present at HEAD."
            exit 0
          fi

          echo "::error::BUY-72491 supervisor: search-blocklist-guard net is BROKEN at HEAD."
          echo "::error::Missing required file(s):"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::error::  MISSING: $f"
          done < missing.txt
          echo "::error::A single reset-and-reapply commit deleted these files."
          echo "::error::The in-file search-blocklist-guard.yml is bypassed when deleted in the same commit (GitHub Actions limitation)."
          echo "::error::Override path: author must restore ALL missing files in this PR and re-push."
          exit 1

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-blocklist-guard-supervisor-evidence-${{ github.run_id }}
          path: |
            required-guards.txt
            present.txt
            missing.txt
            diff-base.txt
            head-sha.txt
            presence-audit.json
          retention-days: 30
          if-no-files-found: ignore