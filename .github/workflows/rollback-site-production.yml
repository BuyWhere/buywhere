name: Rollback buywhere-site-production
on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: 'Cloud Run revision name to route 100% traffic to'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: gaia-calendar-488606
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: buywhere-site-production
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: List current revisions
        run: |
          gcloud run revisions list \
            --service $CLOUD_RUN_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --sort-by=~creationTime \
            --limit 5
      - name: Route traffic to target revision
        run: |
          TARGET="${{ github.event.inputs.target_revision }}"
          echo "Rolling back to revision: $TARGET"
          gcloud run services update-traffic $CLOUD_RUN_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --to-revisions "$TARGET=100"
      - name: Verify traffic routing
        run: |
          gcloud run services describe $CLOUD_RUN_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --format "yaml(status.traffic)"
      - name: Smoke test buywhere.ai
        run: |
          sleep 10
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" https://buywhere.ai --max-time 30 || echo "000")
          BODY=$(curl -sf https://buywhere.ai --max-time 30 2>/dev/null || echo "")
          echo "HTTP status: $HTTP"
          if echo "$BODY" | grep -qi "BuyWhere"; then
            echo "PASS: buywhere.ai returns HTTP $HTTP with BuyWhere in body"
          else
            echo "WARN: buywhere.ai HTTP $HTTP but BuyWhere not found in body"
            echo "Body snippet: ${BODY:0:200}"
          fi
