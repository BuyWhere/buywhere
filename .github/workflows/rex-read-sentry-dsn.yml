name: Rex Read Sentry DSN
on:
  workflow_dispatch:

jobs:
  read-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Write DSN base64 to file
        env:
          S: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: |
          python3 -c "import os, base64; s=os.environ.get('S',''); open('dsn.b64','w').write(base64.b64encode(s.encode()).decode() + chr(10)); print('ok')"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentry-dsn-out
          path: dsn.b64
