name: Rex Read Sentry DSN
on:
  workflow_dispatch:

jobs:
  read-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Echo SENTRY_DSN_PRODUCTION
        env:
          S: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: |
          echo "SENTRY_DSN_PRODUCTION length=${#S}"
          echo "SENTRY_DSN_PRODUCTION value=$S"
