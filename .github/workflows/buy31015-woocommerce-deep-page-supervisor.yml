name: WooCommerce Deep-page Lane Supervisor (BUY-31015)

# Every 8 minutes: check if buy31015-woocommerce-deep-page.mjs is alive,
# restart it if dead, and report cycle count + new-merchant discovery progress.
#
# BUYWHERE LANE: woocommerce_deep
# Supervisor/worker scripts live in the canonical execution workspace (3ec8f6dd).
# The crontab keepalive runs every 8 min from the repo workspace (476c) and
# writes state there. This workflow reads that current state from 476c but
# executes the supervisor binary from 3ec8f6dd.
#
# Worker:       scripts/buy31015-woocommerce-deep-page.mjs
# Supervisor:    buy31015-deep-page-supervisor.mjs
# Supervisor is BUY-51535.

on:
  schedule:
    # Every 8 minutes — matches the BUY-51535 supervisor cadence.
    # The worker runs ~240 s then exits; this tick respawns it if orphaned.
    # 8 min > 4 min tick window of the primary keep-alive, so this is a
    # secondary audit + progress reporter that doesn't need sub-minute granularity.
    - cron: '*/8 * * * *'
  workflow_dispatch:
    # Manual trigger for debugging / backfill

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run WooCommerce deep-page supervisor tick
        id: supervisor
        env:
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}
          PAPERCLIP_RUN_ID: ${{ github.run_id }}
          # The crontab keepalive fires every 8 min and writes to the repo workspace
          # (476c). The canonical execution workspace (3ec8f6dd) holds the supervisor
          # and worker scripts. We read state from 476c (where keepalive writes) but
          # run the supervisor from 3ec8f6dd.
          WC_LANE_STATE_DIR: /paperclip/instances/default/workspaces/476c8023-3635-45bb-9f71-db6f4f5700e1
          WC_LANE_EXEC_DIR: /paperclip/instances/default/workspaces/3ec8f6dd-1735-4479-9825-a2c42edac34c
        run: |
          set -euo pipefail

          ROOT="$WC_LANE_EXEC_DIR"
          SCRIPT_DIR="$ROOT/scripts"
          DATA_DIR="$WC_LANE_STATE_DIR/data"
          LANE_STATE="$DATA_DIR/buy31015-woocommerce-state.json"
          TICK_STATE="$DATA_DIR/buy31015-deep-page-keep-alive-state.json"
          PIDFILE="$DATA_DIR/.buy31015-deep-page.pid"
          SUPERVISOR="$SCRIPT_DIR/buy31015-deep-page-supervisor.mjs"
          WORKER="$SCRIPT_DIR/buy31015-woocommerce-deep-page.mjs"
          SUPERVISOR_DURATION_SEC="${BUY31015_SUPERVISOR_DURATION_SEC:-720}"
          TICKLOG="$DATA_DIR/buy31015-supervisor-tick.log"

          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          say() { echo "[$TS] $*" | tee -a "$TICKLOG"; }

          mkdir -p "$DATA_DIR"

          # ------------------------------------------------------------------
          # 1. Read lane state for cycle count + discovery progress
          # ------------------------------------------------------------------
          if [ -f "$LANE_STATE" ]; then
            CYCLE=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('cycle','?'))" "$LANE_STATE" 2>/dev/null || echo "?")
            LIVE_COUNT=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('live',[])))" "$LANE_STATE" 2>/dev/null || echo "?")
            DEAD_COUNT=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('dead',[])))" "$LANE_STATE" 2>/dev/null || echo "?")
            CURSOR=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('cursor','?'))" "$LANE_STATE" 2>/dev/null || echo "?")
            DISCOVERED_IDX=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('discoveredIdx','?'))" "$LANE_STATE" 2>/dev/null || echo "?")
          else
            CYCLE="?"; LIVE_COUNT="?"; DEAD_COUNT="?"; CURSOR="?"; DISCOVERED_IDX="?"
          fi

          say "state: cycle=$CYCLE live=$LIVE_COUNT dead=$DEAD_COUNT cursor=$CURSOR discoveredIdx=$DISCOVERED_IDX"

          # ------------------------------------------------------------------
          # 2. Read keep-alive tick state for aliveness + streak metrics
          # ------------------------------------------------------------------
          KEEPALIVE_STATUS="unknown"
          HB_AGE_SEC=-1
          if [ -f "$TICK_STATE" ]; then
            KEEPALIVE_STATUS=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('alive_status','unknown'))" "$TICK_STATE" 2>/dev/null || echo "unknown")
            LAST_TS=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('ts',''))" "$TICK_STATE" 2>/dev/null || echo "")
            if [ -n "$LAST_TS" ]; then
              LAST_EPOCH=$(date -u -d "$LAST_TS" +%s 2>/dev/null || echo 0)
              NOW_EPOCH=$(date -u +%s)
              HB_AGE_SEC=$((NOW_EPOCH - LAST_EPOCH))
            fi
          fi

          # ------------------------------------------------------------------
          # 3. Liveness check via supervisor --check
          # ------------------------------------------------------------------
          ALIVE_PID=0
          CHECK_OUTPUT=""
          if CHECK_OUTPUT=$(node "$SUPERVISOR" --check 2>/dev/null); then
            ALIVE_PID=$(printf '%s\n' "$CHECK_OUTPUT" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n 1)
          fi

          FRESH=$([ "$HB_AGE_SEC" -ge 0 ] && [ "$HB_AGE_SEC" -le 120 ] && echo "yes" || echo "no")

          if [ "$KEEPALIVE_STATUS" = "RUNNING" ] && [ "$FRESH" = "yes" ]; then
            say "alive: pid=$ALIVE_PID keepalive_status=$KEEPALIVE_STATUS hb_age=${HB_AGE_SEC}s cycle=$CYCLE discoveredIdx=$DISCOVERED_IDX"
          elif [ "$KEEPALIVE_STATUS" = "RUNNING" ] && [ "$FRESH" = "no" ]; then
            say "stalled: pid=$ALIVE_PID keepalive_status=$KEEPALIVE_STATUS hb_age=${HB_AGE_SEC}s — restarting"
          else
            say "dead: keepalive_status=$KEEPALIVE_STATUS hb_age=${HB_AGE_SEC}s — restarting worker"

            # Kill stale pidfile holder
            if [ -f "$PIDFILE" ]; then
              OLD_PID=$(cut -d'|' -f1 "$PIDFILE" 2>/dev/null | tr -d ' ')
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" 2>/dev/null || true
                sleep 1
                kill -9 "$OLD_PID" 2>/dev/null || true
              fi
              rm -f "$PIDFILE"
            fi

            # Respawn worker via supervisor --restart
            RESTART_OUTPUT=$(node "$SUPERVISOR" --restart 2>&1)
            NEW_PID=$(printf '%s\n' "$RESTART_OUTPUT" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n 1)
            say "respawned: newpid=$NEW_PID cycle=$CYCLE discoveredIdx=$DISCOVERED_IDX"

            # Set output for GitHub Actions
            echo "status=respawned" >> "$GITHUB_OUTPUT"
            echo "pid=$NEW_PID" >> "$GITHUB_OUTPUT"
          fi

          if [ "$KEEPALIVE_STATUS" = "RUNNING" ] && [ "$FRESH" = "yes" ]; then
            echo "status=alive" >> "$GITHUB_OUTPUT"
            echo "pid=$ALIVE_PID" >> "$GITHUB_OUTPUT"
          elif [ "$KEEPALIVE_STATUS" = "RUNNING" ] && [ "$FRESH" = "no" ]; then
            echo "status=stalled" >> "$GITHUB_OUTPUT"
            echo "pid=$ALIVE_PID" >> "$GITHUB_OUTPUT"
          else
            echo "status=dead" >> "$GITHUB_OUTPUT"
            echo "pid=0" >> "$GITHUB_OUTPUT"
          fi

          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "live_count=$LIVE_COUNT" >> "$GITHUB_OUTPUT"
          echo "dead_count=$DEAD_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_merchants=$DISCOVERED_IDX" >> "$GITHUB_OUTPUT"
          echo "heartbeat_age_sec=$HB_AGE_SEC" >> "$GITHUB_OUTPUT"
          echo "keepalive_status=$KEEPALIVE_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload supervisor tick log
        uses: actions/upload-artifact@v4
        with:
          name: buy31015-supervisor-tick-log
          path: /paperclip/instances/default/workspaces/476c8023-3635-45bb-9f71-db6f4f5700e1/data/buy31015-supervisor-tick.log
          retention-days: 3
        if: always()

      - name: Upload lane state snapshot
        uses: actions/upload-artifact@v4
        with:
          name: buy31015-woocommerce-state-snapshot
          path: /paperclip/instances/default/workspaces/476c8023-3635-45bb-9f71-db6f4f5700e1/data/buy31015-woocommerce-state.json
          retention-days: 1
        if: always()

      - name: Report to Paperclip — lane health
        if: success()
        run: |
          echo "BUY-31015 WooCommerce Deep-page Lane Supervisor tick complete."
          echo "status=${{ steps.supervisor.outputs.status }}"
          echo "cycle=${{ steps.supervisor.outputs.cycle }}"
          echo "new_merchants=${{ steps.supervisor.outputs.new_merchants }}"
          echo "pid=${{ steps.supervisor.outputs.pid }}"
          echo "live=${{ steps.supervisor.outputs.live_count }}"
          echo "dead=${{ steps.supervisor.outputs.dead_count }}"
          echo "hb_age_sec=${{ steps.supervisor.outputs.heartbeat_age_sec }}"
          echo "keepalive_status=${{ steps.supervisor.outputs.keepalive_status }}"
