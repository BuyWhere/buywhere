name: Deploy docs.buywhere.ai

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'deploy/nginx/docs.buywhere.ai.conf'
  workflow_dispatch:

jobs:
  guard:
    name: Verify main-only dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main refs (BUY-65234)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::PRODUCTION DEPLOYS MUST COME FROM main. You dispatched from '${GITHUB_REF}'."
          echo "::error::Deploying a feature branch to production ships a stale build."
          echo "::error::Merge your branch to main first; the push to main deploys automatically."
          exit 1

  deploy-docs:
    runs-on: ubuntu-latest
    environment: production
    needs: [guard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install and build
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PRODUCTION_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "sudo mkdir -p /var/www/docs.buywhere.ai"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            docs-site/build/ \
            "${SSH_USER}@${SSH_HOST}:/var/www/docs.buywhere.ai/"

      - name: Smoke test
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://docs.buywhere.ai/ || echo "000")
          if [[ "$STATUS" == "200" ]]; then
            echo "docs.buywhere.ai is live (HTTP $STATUS)"
          else
            echo "WARNING: docs.buywhere.ai returned HTTP $STATUS — nginx config may need reloading"
          fi
