name: Disk Space Watchdog

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

jobs:
  disk-space-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H%MZ)" >> $GITHUB_OUTPUT

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PRODUCTION_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run disk space watchdog on production server
        # Runs the disk watchdog on the actual server at /home/paperclip/buywhere-api
        # where /dev/vda1 is mounted, not on GitHub runners.
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          PAPERCLIP_API_URL: ${{ vars.PAPERCLIP_API_URL || 'https://paperclip.richteo.com' }}
          DISK_EXECUTION_ISSUE: BUY-48198
          DISK_ALERT_SINK: BUY-48198
          DISK_WARN_THRESHOLD_GB: 20
          DISK_CRITICAL_THRESHOLD_GB: 5
          DISK_ALERT_COOLDOWN_HOURS: 1
          DISK_SNAPSHOT_DIR: /paperclip/instances/default/workspaces/476c8023-3635-45bb-9f71-db6f4f5700e1/buywhere-api/data/BUY-48198-disk-check-${{ steps.timestamp.outputs.timestamp }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}
          PAPERCLIP_RUN_ID: ${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "cd /paperclip/instances/default/workspaces/476c8023-3635-45bb-9f71-db6f4f5700e1/buywhere-api && \
             DISK_STATE_FILE=/paperclip/instances/default/workspaces/476c8023-3635-45bb-9f71-db6f4f5700e1/buywhere-api/data/buy-48198-disk-state.json \
             DISK_EXECUTION_ISSUE=${DISK_EXECUTION_ISSUE} \
             DISK_ALERT_SINK=${DISK_ALERT_SINK} \
             DISK_WARN_THRESHOLD_GB=${DISK_WARN_THRESHOLD_GB} \
             DISK_CRITICAL_THRESHOLD_GB=${DISK_CRITICAL_THRESHOLD_GB} \
             DISK_ALERT_COOLDOWN_HOURS=${DISK_ALERT_COOLDOWN_HOURS} \
             DISK_SNAPSHOT_DIR=${DISK_SNAPSHOT_DIR} \
             PAPERCLIP_API_URL=${PAPERCLIP_API_URL} \
             PAPERCLIP_API_KEY=${PAPERCLIP_API_KEY} \
             PAPERCLIP_COMPANY_ID=${PAPERCLIP_COMPANY_ID} \
             PAPERCLIP_RUN_ID=${PAPERCLIP_RUN_ID} \
             node scripts/buy-38913-disk-space-watchdog.js"

      - name: Fetch disk snapshot from server
        if: always()
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
        run: |
          mkdir -p disk-snapshots
          scp -i ~/.ssh/id_ed25519 -r \
            "${SSH_USER}@${SSH_HOST}:/paperclip/instances/default/workspaces/476c8023-3635-45bb-9f71-db6f4f5700e1/buywhere-api/data/BUY-48198-disk-check-${{ steps.timestamp.outputs.timestamp }}" \
            disk-snapshots/

      - name: Upload disk snapshot
        uses: actions/upload-artifact@v4
        with:
          name: disk-snapshot-${{ steps.timestamp.outputs.timestamp }}
          path: disk-snapshots/BUY-48198-disk-check-${{ steps.timestamp.outputs.timestamp }}/
          retention-days: 7
        if: always()

      - name: Report status
        if: always()
        run: |
          SNAPSHOT_DIR="disk-snapshots/BUY-48198-disk-check-${{ steps.timestamp.outputs.timestamp }}"
          if [ -f "$SNAPSHOT_DIR/result.json" ]; then
            echo "=== Disk Space Check Result ==="
            cat "$SNAPSHOT_DIR/result.json"
          fi
