name: Publish buywhere-llamaindex to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish buywhere-llamaindex
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/buywhere-llamaindex/
    permissions:
      id-token: write

    defaults:
      run:
        working-directory: packages/buywhere-llamaindex

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/buywhere-llamaindex/dist/
          skip-existing: false
          verbose: true
