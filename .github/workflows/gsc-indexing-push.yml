name: GSC Indexing Push (daily 07:05 UTC)

# BUY-63866 / BUY-72089: Sitemap freshness lane.
# Generate queue -> write sitemap-lastmod-override-{date}.json + recent slice
# -> commit + push back to main so deploy-www picks it up. Googlebot re-fetches
# URLs whose <lastmod> is newer than its stored value. No Google Indexing API
# call (only accepts JobPosting / BroadcastEvent, BUY-66696) and no
# www.google.com/ping (returns HTTP 404 since 2023-06, Reed confirmed live).

on:
  schedule:
    - cron: "5 7 * * *"   # 07:05 UTC = 00:05 US Pacific (PDT)
  workflow_dispatch:
    inputs:
      date:
        description: 'Queue date override (YYYY-MM-DD)'
        required: false

permissions:
  contents: write

concurrency:
  group: gsc-indexing-push
  cancel-in-progress: false

jobs:
  patch-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install pg --no-save

      - name: Generate indexing queue
        env:
          # Prefer CATALOG_DATABASE_URL (already provisioned) over a separate
          # DATABASE_URL secret. Falls back to DATABASE_URL if an admin sets it.
          DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL || secrets.DATABASE_URL }}
          MAX_QUEUE_URLS: '500'
          LOOKBACK_HOURS: '168'
        run: |
          set -e
          DATE_OVERRIDE="${{ github.event.inputs.date }}"
          if [ -n "$DATE_OVERRIDE" ]; then
            node scripts/generate-indexing-queue.mjs "$DATE_OVERRIDE"
          else
            node scripts/generate-indexing-queue.mjs
          fi

      - name: Generate sitemap lastmod override
        run: |
          set -e
          DATE_OVERRIDE="${{ github.event.inputs.date }}"
          if [ -n "$DATE_OVERRIDE" ]; then
            OVERRIDE_LASTMOD="${DATE_OVERRIDE}T07:05:00.000Z" node scripts/update-sitemap-lastmod.mjs "$DATE_OVERRIDE"
          else
            node scripts/update-sitemap-lastmod.mjs
          fi

      - name: Commit override back to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "Rex (CTO)"
          git config user.email "rex@paperclip.ai"
          git add content/audits/midnight-indexing-queue-*.json \
                  content/audits/sitemap-lastmod-override-*.json \
                  content/audits/sitemap-lastmod-audit-*.json \
                  content/audits/sitemap-products-recent-*.json
          if git diff --cached --quiet; then
            echo "No override files changed today; skipping commit."
            exit 0
          fi
          DATE_OVERRIDE="${{ github.event.inputs.date }}"
          COMMIT_DATE="${DATE_OVERRIDE:-$(date -u +%Y-%m-%d)}"
          git commit -m "[skip ci] chore(BUY-63866): sitemap lastmod override ${COMMIT_DATE}" \
                         -m "Daily sitemap freshness patch (BUY-63866/BUY-72089). Generated by .github/workflows/gsc-indexing-push.yml."
          git push origin HEAD:main
