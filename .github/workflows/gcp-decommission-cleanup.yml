name: GCP Decommission — One-Time Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DECOMMISSION to confirm"
        required: true
        type: string

jobs:
  decommission:
    name: Decommission GCP Resources
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DECOMMISSION'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: List existing Cloud Run services
        run: |
          echo "=== Listing Cloud Run services ==="
          gcloud run services list --project gaia-calendar-488606 --region asia-southeast1 --format json || echo "No services found or error"

      - name: Delete Cloud Run services
        run: |
          for svc in buywhere-api-production buywhere-api buywhere-mcp buywhere-site-production; do
            echo "Deleting Cloud Run service: $svc"
            gcloud run services delete $svc --project gaia-calendar-488606 --region asia-southeast1 --quiet 2>&1 || echo "Service $svc not found or already deleted"
          done

      - name: Delete Artifact Registry repository
        run: |
          echo "Deleting Artifact Registry repository..."
          gcloud artifacts repositories delete buywhere --project gaia-calendar-488606 --location asia-southeast1 --quiet 2>&1 || echo "Repository not found or already deleted"

      - name: List and delete Secret Manager secrets
        run: |
          echo "=== Listing Secret Manager secrets ==="
          SECRETS=$(gcloud secrets list --project gaia-calendar-488606 --format "value(name)" 2>/dev/null)
          if [ -n "$SECRETS" ]; then
            echo "Found secrets: $SECRETS"
            for secret in $SECRETS; do
              echo "Deleting secret: $secret"
              gcloud secrets delete $secret --project gaia-calendar-488606 --quiet 2>&1 || echo "Failed to delete $secret"
            done
          else
            echo "No secrets found"
          fi

      - name: Delete service account and keys
        run: |
          SA="buywhere-api-sa@gaia-calendar-488606.iam.gserviceaccount.com"
          echo "Deleting service account keys and account: $SA"
          gcloud iam service-accounts keys list --iam-account $SA --project gaia-calendar-488606 --format "value(keyId)" 2>/dev/null | while read key_id; do
            echo "Deleting key: $key_id"
            gcloud iam service-accounts keys delete $key_id --iam-account $SA --project gaia-calendar-488606 --quiet 2>&1 || true
          done
          gcloud iam service-accounts delete $SA --project gaia-calendar-488606 --quiet 2>&1 || echo "SA not found or already deleted"

      - name: Verify cleanup
        run: |
          echo "=== Final State Verification ==="
          echo "--- Cloud Run Services ---"
          gcloud run services list --project gaia-calendar-488606 --region asia-southeast1 2>&1 || echo "No services"
          echo "--- Artifact Registry ---"
          gcloud artifacts repositories list --project gaia-calendar-488606 --location asia-southeast1 2>&1 || echo "No repositories"
          echo "--- Secret Manager ---"
          gcloud secrets list --project gaia-calendar-488606 2>&1 || echo "No secrets"
          echo "--- Service Accounts ---"
          gcloud iam service-accounts list --project gaia-calendar-488606 --filter="email:buywhere" 2>&1 || echo "No matching SAs"
          echo "=== Cleanup Complete ==="
