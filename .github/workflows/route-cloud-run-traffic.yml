name: Route Cloud Run Traffic to Latest
on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: 'Specific revision name (leave empty for --to-latest)'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: gaia-calendar-488606
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: buywhere-api-production
jobs:
  route-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: List revisions
        run: |
          gcloud run revisions list \
            --service $CLOUD_RUN_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --sort-by=~creationTime \
            --limit 5
      - name: Route traffic
        run: |
          TARGET="${{ github.event.inputs.target_revision }}"
          if [ -z "$TARGET" ]; then
            echo "Routing to latest..."
            gcloud run services update-traffic $CLOUD_RUN_SERVICE \
              --project $GCP_PROJECT_ID \
              --region $GCP_REGION \
              --to-latest
          else
            echo "Routing to specific revision: $TARGET"
            gcloud run services update-traffic $CLOUD_RUN_SERVICE \
              --project $GCP_PROJECT_ID \
              --region $GCP_REGION \
              --to-revisions "$TARGET=100"
          fi
      - name: Verify traffic
        run: |
          gcloud run services describe $CLOUD_RUN_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --format "yaml(status.traffic)"
