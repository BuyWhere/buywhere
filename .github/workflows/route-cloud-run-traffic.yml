name: Route Cloud Run Traffic to Latest
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: gaia-calendar-488606
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: buywhere-api-production
jobs:
  route-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Route traffic to latest revision
        run: |
          echo "Current traffic:"
          gcloud run services describe $CLOUD_RUN_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --format "yaml(status.traffic)"
          echo "Routing traffic to latest..."
          gcloud run services update-traffic $CLOUD_RUN_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --to-latest
          echo "Updated traffic:"
          gcloud run services describe $CLOUD_RUN_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --format "yaml(status.traffic)"
