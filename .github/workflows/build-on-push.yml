name: Build site image on push to main

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: gaia-calendar-488606
  GCP_REGION: asia-southeast1
  ARTIFACT_REGISTRY: asia-southeast1-docker.pkg.dev
  IMAGE_REPO: cloud-run-source-deploy

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Governance rule #10 — no production mock data (BUY-60872)
        run: bash scripts/guard-production-mock-data.sh

  build:
    name: Build and push site image
    runs-on: ubuntu-latest
    needs: [guard]
    outputs:
      full_image: ${{ steps.tag.outputs.full_image }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Set image tag
        id: tag
        run: |
          TAG="sha-${{ github.sha }}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          FULL_IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_REPO }}/site:${TAG}"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Built image tag: ${TAG}"
          echo "Full image: ${FULL_IMAGE}"

      - name: Build and push site image
        env:
          FULL_IMAGE: ${{ steps.tag.outputs.full_image }}
        run: |
          docker build -t "$FULL_IMAGE" -f site.Dockerfile .
          docker push "$FULL_IMAGE"
          echo "Successfully pushed ${FULL_IMAGE}"
