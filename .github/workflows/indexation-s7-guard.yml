# indexation-§7-guard — BUY-74937 (verification protocol enforcement)
#
# Per Indexation Directive 2026-08-25 §7 (canonical:
# https://github.com/BuyWhere/buywhere/blob/main/DIRECTIVE-indexation-2026-08-25.md),
# every PR that touches routes, content, sitemaps, or middleware MUST carry the
# §7 verification evidence before merge. 4seen runs an independent guard every
# 6 hours; this workflow is the in-repo companion — it posts the §7 checklist as
# a PR comment so the deploying agent has a single canonical place to fill in
# evidence, and 4seen has a comparable comment to read.
#
# Triggers:
#   - pull_request to main
# Behavior:
#   1. Run scripts/check-commit-scope.sh on the PR diff (HEAD vs origin/main).
#      FAIL on >25 files OR on deletions under protected paths.
#   2. If the PR touches any of: src/app/, content/, src/middleware.ts,
#      src/lib/sitemaps.ts, public/sitemap*.xml, robots.txt, canonical/noindex
#      headers, or next.config.*, post the §7 checklist as a sticky PR comment
#      (idempotent — same `comment_id` key for re-runs on the same PR).
#   3. On push to main (i.e. the deploy), post the §7 "deploy-time" reminder
#      so the merging agent has the reminder comment open before they close
#      the deploy ticket.
#
# Why a separate workflow (not in the PR template alone):
#   - The PR template is a documentation gate. This is a CI gate.
#   - Without it, agents can merge a §7-touching PR without ever checking the
#     boxes; the PR template body is invisible to 4seen unless we also post it.
#
# Pushed 2026-08-26 by ops via Richmond's GitHub session (BUY-74938) after review:
# removed pull_request_target; added the missing `id: find-pr` on the deploy-reminder step.
# ORIGINAL NOTE (BUY-74937): file is committed on `intent-pages` (d90c6c45)
# but the fleet PAT used by Atlas does not hold the `workflow` scope, so
# `git push` is rejected with "refusing to allow a Personal Access Token to
# create or update workflow". This is the same constraint the local
# check-commit-scope.sh script explicitly documents in its header. Until
# Richmond either grants the workflow scope OR commits this file himself
# (he has admin scope) the §7 CI guard cannot be deployed. 4seen's external
# 6-hourly guard is the only live enforcement until then. Atlas has
# escalated the blocker on BUY-74937.
#
# Override path: none. §7 is non-negotiable per the directive.
#
# Last §7 PRs (visible evidence the protocol is being followed) are linked from
# this workflow's run summaries. Atlas QA owns this file; any change is logged
# on BUY-74937.

name: indexation-§7-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Serialize so re-runs on the same PR don't race.
concurrency:
  group: indexation-§7-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # needed to post the §7 checklist comment on PRs
  issues: write          # needed to upsert the sticky §7 comment

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Scope guard — fail the PR if check-commit-scope.sh fails.
  # ──────────────────────────────────────────────────────────────────────────
  scope-guard:
    name: check-commit-scope (rule 2/3/9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # need HEAD~1..HEAD + base ref

      - name: Resolve base ref
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify guarded files exist at HEAD
        run: |
          set -euo pipefail
          MISSING=0
          for f in scripts/check-commit-scope.sh .github/PULL_REQUEST_TEMPLATE.md; do
            if [ ! -f "$f" ]; then
              echo "::error::§7 guard: required file missing at HEAD: $f (the PR template + scope guard must always be present)."
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Run check-commit-scope.sh on the PR diff
        run: |
          bash scripts/check-commit-scope.sh \
            --base "${{ steps.base.outputs.ref }}" \
            --head  HEAD

  # ──────────────────────────────────────────────────────────────────────────
  # 2. PR-comment guard — post the §7 checklist on PRs that touch §7 surfaces.
  # Runs on pull_request (same-repo branches get a write-capable GITHUB_TOKEN).
  # Does NOT checkout untrusted code (we never build the PR); it only reads the
  # base + head SHAs from the event payload.
  # ──────────────────────────────────────────────────────────────────────────
  pr-comment:
    name: post §7 checklist on PR
    needs: scope-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch changed files for this PR
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          # paginate; small PRs fit on one page
          for page in 1 2 3; do
            URL="https://api.github.com/repos/${REPO}/pulls/${PR}/files?per_page=100&page=${page}"
            RESP="$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$URL")"
            COUNT=$(printf '%s' "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo 0)
            if [ "$COUNT" -eq 0 ]; then break; fi
            printf '%s' "$RESP" \
              | python3 -c "import sys,json; [print(f['filename']) for f in json.load(sys.stdin)]" \
              | tee -a /tmp/changed.txt >/dev/null
            if [ "$COUNT" -lt 100 ]; then break; fi
          done
          if [ ! -s /tmp/changed.txt ]; then
            echo "NO_FILES"; exit 0
          fi
          # Match against the §7 surface list. Match-on-prefix is enough for
          # directories; exact match for top-level files like robots.txt.
          if grep -E -q '^(src/app/|content/|src/middleware\.ts$|src/lib/sitemaps\.ts$|public/sitemap|robots\.txt$|next\.config\.|src/lib/active-blog-slugs\.ts$)' /tmp/changed.txt; then
            echo "TOUCHES=1" >> "$GITHUB_OUTPUT"
          else
            echo "TOUCHES=0" >> "$GITHUB_OUTPUT"
          fi
          printf 'changed=%s\n' "$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Post / update the §7 PR comment
        if: steps.files.outputs.TOUCHES == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR:   ${{ github.event.pull_request.user.login }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- §7-sticky:indexation-directive -->';
            const body = [
              marker,
              '## §7 PR checklist (Indexation Directive 2026-08-25)',
              '',
              'This PR touches one or more §7 surfaces. Before merge the author must complete',
              'the three evidence fields below. 4seen will compare them against the live site',
              'within 6 hours; every §7 catch is logged against the merging agent.',
              '',
              '- **PR**: #' + context.issue.number,
              '- **Branch**: `' + context.payload.pull_request.head.ref + '` → `main`',
              '- **Author**: @' + (context.payload.pull_request.user.login || '?'),
              '- **Changed files**: see workflow run summary above',
              '',
              '### Required evidence (paste the outputs into the deploy ticket BEFORE merging)',
              '',
              '```',
              '# 1. Pre-deploy snapshot (must be RUN BEFORE the merge is pushed)',
              'bash /usr/local/sbin/aeo-publish-verify.sh snapshot',
              '',
              '# 2. Post-deploy verify (must be RUN AFTER the deploy rolls out)',
              'bash /usr/local/sbin/aeo-publish-verify.sh verify',
              '',
              '# 3. Diff --stat proving in-scope files only',
              'git diff --stat origin/main~1..HEAD',
              '',
              '# 4. Helper that renders the canonical §7 comment body to paste on the ticket',
              'bash scripts/aeo-§7-comment.sh snapshot <TICKET>',
              'bash scripts/aeo-§7-comment.sh verify   <TICKET>',
              '```',
              '',
              '> Counts may only go UP. Any decrease = revert + escalate per §7 rule 1.',
              '> 200-probe ALL of `sitemap-blog.xml` + 10% of every other child sitemap.',
              '> Diff must touch only in-scope files; outside-scope = stale-tree smell (rule 2).',
              '',
              '> Posted by `indexation-§7-guard` on every push to this PR (idempotent).',
              ''
            ].join('\n');

            // Idempotent upsert: find existing marker comment, edit or create.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
              core.info('Updated existing §7 comment ' + existing.id);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              });
              core.info('Posted new §7 comment');
            }

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Deploy-time reminder — when main is pushed (the deploy event), post a
  # short reminder on the most-recent merged PR so the deploying agent has it
  # open when they fill in §7 evidence on the deploy ticket.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-reminder:
    name: §7 deploy-time reminder
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Find the PR that just landed
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          URL="https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/pulls"
          RESP="$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$URL")"
          PR_NUM="$(printf '%s' "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d[0]['number'] if d else ''))")"
          if [ -z "$PR_NUM" ]; then
            echo "NO_PR"; exit 0
          fi
          echo "PR_NUMBER=${PR_NUM}" >> "$GITHUB_OUTPUT"

      - name: Post §7 deploy reminder on the merged PR
        if: steps.find-pr.outputs.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- §7-deploy-reminder -->';
            const prNumber = '${{ steps.find-pr.outputs.PR_NUMBER }}';
            const body = [
              marker,
              '## §7 deploy rolled out — fill in evidence on the deploy ticket',
              '',
              'Deploy commit: `' + (context.sha || '').slice(0, 12) + '`',
              '',
              'Before you mark this deploy done, post the **post-deploy** §7 comment on the',
              'deploy ticket using:',
              '',
              '```',
              'bash scripts/aeo-§7-comment.sh verify <TICKET_ID>',
              '```',
              '',
              'Required evidence (paste real numbers — never blanks):',
              '1. Sitemap counts before → after (any decrease = revert + escalate).',
              '2. `RESULT: PASS` line from `aeo-publish-verify.sh verify` (200-probe).',
              '3. `git diff --stat origin/main~1..HEAD` proving in-scope files only.',
              '',
              '> Posted by `indexation-§7-guard` once per push to `main`. Idempotent.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(prNumber), per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(prNumber), body
              });
            }