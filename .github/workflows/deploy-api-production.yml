name: Deploy TypeScript API to production

# BUY-15318: Production API now lives on Railway (buywhere-api service
# 945e8a6d-6f89-41f1-8256-b8cc6a872a33, env ebcb2ca2-f5e8-4713-a3e1-48c92e2b23ae).
# The previous GCP Cloud Run + SSH-into-VM deploy path is retired. The
# push-to-main path is owned by .github/workflows/deploy-railway.yml; this
# workflow is the manual / on-demand entry point (workflow_dispatch) that
# re-deploys against a chosen image tag (or git SHA).
#
# Secrets:
#   RAILWAY_TOKEN          Project-scoped Railway deploy token
#   BUYWHERE_SMOKE_KEY     API key for regression + smoke tests
#
# See: BUY-15318 (Railway migration), BUY-33837 (re-deployed routes),
#      BUY-33907 (AQS route + workflow / aqs_cycles table deploy together).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: git SHA)'
        required: false
      test_scope:
        description: 'Regression test scope to run before deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - search
          - products
          - categories
      service_id:
        description: 'Railway service id (default: buywhere-api 945e8a6d-...)'
        required: false
        default: '945e8a6d-6f89-41f1-8256-b8cc6a872a33'
      environment_id:
        description: 'Railway environment id (default: production ebcb2ca2-...)'
        required: false
        default: 'ebcb2ca2-f5e8-4713-a3e1-48c92e2b23ae'

env:
  SERVICE_NAME: buywhere-api

jobs:
  api-regression:
    name: API Regression (${{ github.event.inputs.test_scope || 'all' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run regression tests
        env:
          REGRESSION_BASE_URL: https://api.buywhere.ai
          BUYWHERE_API_KEY: ${{ secrets.BUYWHERE_SMOKE_KEY }}
        run: |
          SCOPE="${{ github.event.inputs.test_scope || 'all' }}"
          if [ "$SCOPE" = "all" ]; then
            pytest api/tests/api/test_api_endpoints.py -v
          else
            pytest api/tests/api/test_api_endpoints.py -v -m "$SCOPE"
          fi

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: [api-regression]

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy buywhere-api to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ github.event.inputs.service_id || '945e8a6d-6f89-41f1-8256-b8cc6a872a33' }}
          ENVIRONMENT_ID: ${{ github.event.inputs.environment_id || 'ebcb2ca2-f5e8-4713-a3e1-48c92e2b23ae' }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          railway up \
            --service "${SERVICE_ID}" \
            --environment "${ENVIRONMENT_ID}" \
            --detach \
            -m "Deploy ${SERVICE_NAME} (image_tag=${IMAGE_TAG}, sha=${GITHUB_SHA::7})"
          echo "Railway deploy triggered (image_tag=${IMAGE_TAG})"

      - name: Wait for deploy
        run: |
          echo "Waiting 120s for Railway to roll out..."
          sleep 120

      - name: Smoke test Railway endpoint
        run: |
          echo "=== Smoke testing api.buywhere.ai ==="
          for ENDPOINT in /health /v1/aqs/health "/v1/ingest/health"; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://api.buywhere.ai${ENDPOINT}")
            echo "GET $ENDPOINT → HTTP $HTTP"
            if [[ "$ENDPOINT" == "/health" && "$HTTP" != "200" ]]; then
              echo "ERROR: /health should return 200" && exit 1
            fi
            if [[ "$ENDPOINT" == "/v1/ingest/health" && "$HTTP" == "404" ]]; then
              echo "ERROR: /v1/ingest/health returned 404 — route not deployed" && exit 1
            fi
          done
          echo "Smoke tests passed"

      - name: Smoke test search endpoint
        env:
          BUYWHERE_API_KEY: ${{ secrets.BUYWHERE_SMOKE_KEY }}
        run: |
          sleep 5
          echo "=== Smoke testing search endpoint (BUY-31302) ==="
          chmod +x api/scripts/smoke-test-search.sh
          MAX_TIME=1 api/scripts/smoke-test-search.sh

      - name: Smoke test agent-readiness headers
        run: |
          sleep 3

          echo "=== Smoke testing apex TLS and homepage paths ==="
          ./scripts/smoke-apex-tls.sh

          echo "=== Smoke testing agent-readiness ==="

          CS=$(curl -sI https://api.buywhere.ai/robots.txt | grep -i "content-signal" || echo "MISSING")
          echo "Content-Signal: ${CS}"

          LINK=$(curl -sI https://api.buywhere.ai/ | grep -i "^link:" || echo "MISSING")
          echo "Link (on /): ${LINK}"

          CT=$(curl -sI -H "Accept: text/markdown" https://api.buywhere.ai/ | grep -i "content-type" || echo "MISSING")
          echo "Content-Type (markdown req): ${CT}"

          CT_DOCS=$(curl -sI -H "Accept: text/markdown" https://api.buywhere.ai/docs/guides/mcp | grep -i "content-type" || echo "MISSING")
          echo "Content-Type /docs/guides/mcp: ${CT_DOCS}"

          if echo "${CS}${LINK}${CT}${CT_DOCS}" | grep -q "MISSING"; then
            echo "ERROR: one or more agent-readiness headers missing after deploy"
            exit 1
          fi
          echo "All agent-readiness checks passed."
