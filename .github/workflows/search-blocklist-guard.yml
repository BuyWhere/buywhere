# search-blocklist-guard — BUY-72491
# Hard-fails a PR that removes or weakens SEARCH_IMAGE_BLOCKED_HOSTS or the
# `hasUsableProductImage` blocklist call-site in src/app/search/SearchResultsClient.tsx.
#
# Background: BUY-72350/BUY-72375/BUY-72470. c1.neweggimages.com serves HTTP 400
# (AkamaiGHost bot-detection) on every referer. Blocklist must short-circuit
# these URLs inside hasUsableProductImage so /search never emits an <img> tag
# for them. Three separate commits touched this file in 5 hours (BUY-72375,
# BUY-72387 2d53dc31, BUY-72470) — and 2d53dc31 silently deleted the blocklist
# while reframing root metadata. This guard prevents the next regression.
#
# Checks, all must pass:
#   1. AST/source: SEARCH_IMAGE_BLOCKED_HOSTS Set literal contains all 4 Newegg
#      hosts (c1/www/apex + images10.newegg.com) and does NOT include BUY-71639
#      carve-outs (cdn.shopify.com, m.media-amazon.com).
#   2. Call-site: hasUsableProductImage body calls
#      SEARCH_IMAGE_BLOCKED_HOSTS.has(hostname).
#   3. Regression test: src/app/search/SearchResultsClient.blocklist.test.mjs
#      is present at HEAD, asserts all 4 hosts, AND `node --test` passes.
#
# The dedicated blocklist test file is the source of truth. The older
# SearchResultsClient.productImageParity.test.mjs file mixes BUY-71856 image
# parity assertions with BUY-72375 blocklist assertions; the BUY-71856
# assertions are pre-existing failures unrelated to the blocklist, so they
# would block every PR if wired in here.
#
# Companion: search-blocklist-guard-supervisor.yml closes the bypass where this
# file itself is deleted in a single commit (GitHub Actions skips a workflow
# deleted in the same commit).
#
# Triggers: pull_request to main + push to main + workflow_dispatch (test mode).
# Behavior: hard-fails (exit 1) with ::error:: naming the missing host(s).
# Override: none at v1 — author must restore the blocklist.

name: search-blocklist-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Set to "true" to inject a synthetic blocklist deletion (test mode)'
        required: false
        default: 'false'
      missing_host:
        description: 'Host to simulate as removed (one of c1.neweggimages.com, www.neweggimages.com, neweggimages.com, images10.newegg.com)'
        required: false
        default: 'c1.neweggimages.com'

concurrency:
  group: search-blocklist-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate the source file under test
        run: |
          set -euo pipefail
          SOURCE="src/app/search/SearchResultsClient.tsx"
          if [ ! -f "$SOURCE" ]; then
            echo "::error::BUY-72491 guard: source file missing at HEAD: $SOURCE"
            exit 1
          fi
          echo "$SOURCE" > source-path.txt
          echo "Source file: $SOURCE ($(wc -l < "$SOURCE") lines)"

      - name: AST check — SEARCH_IMAGE_BLOCKED_HOSTS contains all 4 Newegg hosts
        run: |
          set -euo pipefail
          SOURCE=$(cat source-path.txt)
          python3 > ast-result.txt <<'PYEOF'
          import re, sys, pathlib
          src = pathlib.Path("src/app/search/SearchResultsClient.tsx").read_text()
          set_match = re.search(
              r'const\s+SEARCH_IMAGE_BLOCKED_HOSTS\s*=\s*new\s+Set\s*\(([\s\S]*?)\);',
              src
          )
          required = [
              'c1.neweggimages.com',
              'www.neweggimages.com',
              'neweggimages.com',
              'images10.newegg.com',
          ]
          forbidden = ['cdn.shopify.com', 'm.media-amazon.com']  # BUY-71639 carve-out
          if not set_match:
              print("MISSING_SET_LITERAL")
              for h in required:
                  print("MISSING_HOST\t" + h)
              sys.exit(0)
          set_body = set_match.group(1)
          host_re = lambda h: re.compile(r"""['"]""" + re.escape(h) + r"""['"]""")
          missing = [h for h in required if not host_re(h).search(set_body)]
          widened = [h for h in forbidden if host_re(h).search(set_body)]
          if missing:
              print("MISSING_HOSTS")
              for h in missing:
                  print("MISSING_HOST\t" + h)
          if widened:
              print("WIDENED_BLOCKLIST")
              for h in widened:
                  print("FORBIDDEN_HOST\t" + h)
          if not missing and not widened:
              print("OK")
          PYEOF
          RESULT=$(cat ast-result.txt)
          echo "AST result: $RESULT"
          if [ "$RESULT" != "OK" ]; then
            echo "::error::BUY-72491 guard: SearchResultsClient.tsx blocklist AST check FAILED."
            while IFS= read -r line; do
              case "$line" in
                MISSING_HOST*) echo "::error::  MISSING host: $(echo "$line" | cut -f2)" ;;
                FORBIDDEN_HOST*) echo "::error::  FORBIDDEN host (BUY-71639 carve-out broken): $(echo "$line" | cut -f2)" ;;
              esac
            done < ast-result.txt
            echo "::error::Restore SEARCH_IMAGE_BLOCKED_HOSTS to all 4 Newegg hosts. See BUY-72470 commit 7d09fad1c for the canonical restore."
            exit 1
          fi
          echo "AST check passed: all 4 Newegg hosts present, no forbidden widening."

      - name: AST check — hasUsableProductImage calls .has(hostname)
        run: |
          set -euo pipefail
          python3 > call-site-result.txt <<'PYEOF'
          import re, sys, pathlib
          src = pathlib.Path("src/app/search/SearchResultsClient.tsx").read_text()
          fn_match = re.search(
              r'function\s+hasUsableProductImage\s*\([\s\S]*?\)\s*\{([\s\S]*?)\n\}',
              src
          )
          if not fn_match:
              print("MISSING_FUNCTION")
              sys.exit(0)
          fn_body = fn_match.group(1)
          if 'SEARCH_IMAGE_BLOCKED_HOSTS.has(hostname)' not in fn_body:
              print("MISSING_HAS_CHECK")
              sys.exit(0)
          print("OK")
          PYEOF
          RESULT=$(cat call-site-result.txt)
          if [ "$RESULT" != "OK" ]; then
            echo "::error::BUY-72491 guard: hasUsableProductImage does not call SEARCH_IMAGE_BLOCKED_HOSTS.has(hostname)."
            echo "::error::Without this call-site the blocklist is decorative, not load-bearing."
            echo "::error::Restore the call-site per BUY-72470 commit 7d09fad1c."
            exit 1
          fi
          echo "Call-site check passed."

      - name: Test-mode simulation (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.simulate_failure == 'true'
        run: |
          set -euo pipefail
          MISSING="${{ inputs.missing_host }}"
          echo "TEST MODE: simulating absence of $MISSING"
          # Mutate ast-result.txt to force the failure path and verify the
          # ::error:: emission works end-to-end.
          {
            echo "MISSING_HOSTS"
            echo "MISSING_HOST	$MISSING"
          } > ast-result.txt
          cat ast-result.txt
          # Also force the AST check step to fail by re-running its body.
          echo "::error::BUY-72491 guard: SearchResultsClient.tsx blocklist AST check FAILED."
          echo "::error::  MISSING host: $MISSING"
          echo "::error::TEST MODE: simulated failure — guard hard-fail path verified."
          exit 1

      - name: Verify the regression test file is present and asserts all 4 hosts
        run: |
          set -euo pipefail
          TEST_FILE="src/app/search/SearchResultsClient.blocklist.test.mjs"
          if [ ! -f "$TEST_FILE" ]; then
            echo "::error::BUY-72491 guard: regression test file missing at HEAD: $TEST_FILE"
            echo "::error::The blocklist guard needs its own regression test. Restore it from BUY-72491."
            exit 1
          fi
          # Cross-file sentinel: the regression test must assert each of the 4
          # hosts, otherwise it's not actually testing the right thing.
          for host in c1.neweggimages.com www.neweggimages.com neweggimages.com images10.newegg.com; do
            if ! grep -qF "$host" "$TEST_FILE"; then
              echo "::error::BUY-72491 guard: regression test file does not assert host '$host'."
              exit 1
            fi
          done
          echo "Regression test file present and asserts all 4 Newegg hosts."

      - name: Run the dedicated blocklist regression test
        run: |
          set -euo pipefail
          node --test src/app/search/SearchResultsClient.blocklist.test.mjs 2>&1 | tee test-output.txt
          echo "Regression test run complete."

      - name: Build AST/test audit (JSON) for evidence artifact
        if: always()
        run: |
          set -euo pipefail
          python3 > audit.json <<'PYEOF'
          import json, os, pathlib
          audit = {
              "guard": "search-blocklist-guard",
              "issue": "BUY-72491",
              "parent_issues": ["BUY-72350", "BUY-72375", "BUY-72470"],
              "head_sha": os.environ.get("GITHUB_SHA", "").strip(),
              "ast_result": pathlib.Path("ast-result.txt").read_text().strip() if pathlib.Path("ast-result.txt").exists() else None,
              "call_site_result": pathlib.Path("call-site-result.txt").read_text().strip() if pathlib.Path("call-site-result.txt").exists() else None,
              "test_file_present": pathlib.Path("src/app/search/SearchResultsClient.blocklist.test.mjs").exists(),
              "guard_intact": True,
          }
          print(json.dumps(audit, indent=2))
          PYEOF
          cat audit.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-blocklist-guard-evidence-${{ github.run_id }}
          path: |
            source-path.txt
            ast-result.txt
            call-site-result.txt
            test-output.txt
            audit.json
          retention-days: 30
          if-no-files-found: ignore