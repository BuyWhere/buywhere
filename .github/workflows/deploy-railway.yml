name: Deploy API to Railway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Railway environment to deploy to'
        required: false
        default: 'production'

concurrency:
  group: buywhere-api-railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy buywhere-api to Railway via GraphQL
        run: |
          DEPLOY_RESP=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeploy(environmentId: \\\"ebcb2ca2-f5e8-4713-a3e1-48c92e2b23ae\\\", serviceId: \\\"945e8a6d-6f89-41f1-8256-b8cc6a872a33\\\") }\"}")
          echo "Deploy response: $DEPLOY_RESP"
          if ! echo "$DEPLOY_RESP" | jq -e '.data.serviceInstanceDeploy' > /dev/null 2>&1; then
            echo "ERROR: Deploy mutation failed"
            echo "$DEPLOY_RESP" | jq .
            exit 1
          fi
          echo "Deploy triggered successfully"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Smoke test Railway endpoint
        run: |
          echo "Waiting 120s for deploy to complete..."
          sleep 120
          echo "=== Smoke testing api.buywhere.ai ==="
          for ENDPOINT in /health "/v1/ingest/health"; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://api.buywhere.ai${ENDPOINT}")
            echo "GET $ENDPOINT → HTTP $HTTP"
            if [[ "$ENDPOINT" == "/health" && "$HTTP" != "200" ]]; then
              echo "ERROR: /health should return 200" && exit 1
            fi
            if [[ "$ENDPOINT" == "/v1/ingest/health" && "$HTTP" == "404" ]]; then
              echo "ERROR: /v1/ingest/health returned 404 — route not deployed" && exit 1
            fi
          done

          CATALOG_JSON=$(curl -fsS "https://api.buywhere.ai/v1/catalog/stats")
          echo "$CATALOG_JSON" | jq '.'
          SOURCE=$(echo "$CATALOG_JSON" | jq -r '.meta.source')
          if [[ "$SOURCE" != "catalog_stats" && "$SOURCE" != "pg_class_fallback" ]]; then
            echo "ERROR: catalog stats meta.source unexpected: $SOURCE"
            exit 1
          fi
          echo "catalog/stats OK — source=$SOURCE"

          CATEGORIES_JSON=$(curl -fsS "https://api.buywhere.ai/v1/catalog/categories")
          echo "$CATEGORIES_JSON" | jq '{total: .meta.total, source: .meta.source, first: (.data[0] // null)}'
          CAT_SOURCE=$(echo "$CATEGORIES_JSON" | jq -r '.meta.source')
          CAT_TOTAL=$(echo "$CATEGORIES_JSON" | jq -r '.meta.total // 0')
          if [[ -z "$CAT_SOURCE" || "$CAT_TOTAL" == "0" ]]; then
            echo "ERROR: catalog/categories returned no data or missing source"
            exit 1
          fi
          echo "catalog/categories OK — source=$CAT_SOURCE total=$CAT_TOTAL"

          EMAIL="gha-railway-smoke-${GITHUB_RUN_ID}@buywhere.ai"
          REGISTER_JSON=$(curl -fsS -X POST "https://api.buywhere.ai/v1/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${EMAIL}\",\"agent_name\":\"GitHub Actions Railway Smoke\",\"agent_type\":\"github_actions\"}")
          API_KEY=$(echo "$REGISTER_JSON" | jq -r '.api_key // empty')
          if [[ -z "$API_KEY" ]]; then
            echo "ERROR: failed to mint smoke-test API key"
            echo "$REGISTER_JSON"
            exit 1
          fi

          SEARCH_JSON=$(curl -fsS "https://api.buywhere.ai/v1/products/search?q=laptop&country_code=SG" \
            -H "Authorization: Bearer ${API_KEY}")
          echo "$SEARCH_JSON" | jq '{total, first: (.results[0] // null), error}'
          SEARCH_ERROR=$(echo "$SEARCH_JSON" | jq -r '.error // empty')
          SEARCH_TOTAL=$(echo "$SEARCH_JSON" | jq -r '.total // 0')
          if [[ -n "$SEARCH_ERROR" || "$SEARCH_TOTAL" == "0" ]]; then
            echo "ERROR: search smoke test failed"
            exit 1
          fi

          echo "Smoke tests passed"
