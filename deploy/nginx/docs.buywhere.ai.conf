# docs.buywhere.ai — Docusaurus static site
# Deployed by nginx-deploy.yml into /etc/nginx/sites-enabled/
# Serves the built Docusaurus docs from /var/www/docs.buywhere.ai/

server {
    server_name docs.buywhere.ai;

    root /var/www/docs.buywhere.ai;
    index index.html;

    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/docs.buywhere.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.buywhere.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = docs.buywhere.ai) {
        return 301 https://$host$request_uri;
    }

    server_name docs.buywhere.ai;
    listen 80;
    return 404;
}
